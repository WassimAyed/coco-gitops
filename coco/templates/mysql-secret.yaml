{{- if .Values.mysql.enabled }}
# PIÈCE 1 — Le coffre-fort CHIFFRÉ (Sealed Secrets).
# Ce fichier est CHIFFRÉ : safe à committer dans Git, même en repo public.
# Seul le contrôleur sealed-secrets DANS le cluster possède la clé privée pour le déchiffrer.
# Au déploiement, le contrôleur le transforme automatiquement en Secret "mysql-secret" classique,
# que MySQL, userService et covoiturageService consomment via secretKeyRef (inchangé).
#
# Regénérer après changement de mot de passe :
#   kubectl create secret generic mysql-secret -n coco \
#     --from-literal=mysql-root-password='NOUVEAU_MDP' --dry-run=client -o yaml \
#     | kubeseal --controller-namespace kube-system --format yaml > mysql-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mysql-secret
  namespace: coco
spec:
  encryptedData:
    mysql-root-password: 
  template:
    metadata:
      name: mysql-secret
      namespace: coco
      labels:
        app: mysql
    type: Opaque
{{- end }}
